<!DOCTYPE html>
<html>
<head>
  <title>ShopEasy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>ShopEasy</h1>
  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Cart (<span id="count">0</span>)</a>
  </nav>
</header>

<section id="home">
  <h2>Welcome to ShopEasy</h2>
  <p>Quality products at affordable prices</p>
</section>

<section id="products">
  <h2>Products</h2>

  <div class="products">
    <div class="card">
      <img src="shoe.jpg">
      <h3>Sports Shoes</h3>
      <p>₹1499</p>
      <button onclick="addCart('Sports Shoes',1499)">Add to Cart</button>
    </div>

    <div class="card">
      <img src="watch.jpg">
      <h3>Smart Watch</h3>
      <p>₹1999</p>
      <button onclick="addCart('Smart Watch',1999)">Add to Cart</button>
    </div>

    <div class="card">
      <img src="bag.jpg">
      <h3>Travel Bag</h3>
      <p>₹999</p>
      <button onclick="addCart('Travel Bag',999)">Add to Cart</button>
    </div>
  </div>
</section>

<section id="cart">
  <h2>Shopping Cart</h2>
  <div id="cartItems"></div>
  <h3>Total: ₹<span id="total">0</span></h3>
  <button onclick="checkout()">Checkout</button>
</section>

<script src="script.js"></script>
</body>
</html>
